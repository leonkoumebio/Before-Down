<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Évasion</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
  }

    #intro-video-container {
    transition: opacity 1s ease;
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    background: black;
    z-index: 9999;
  }

  #intro-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Message si le téléphone est en portrait */
  #rotate-message {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    background: black;
    color: white;
    z-index: 10000;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: sans-serif;
    font-size: 18px;
    padding: 20px;
  }

    @media (orientation: portrait) {
    #rotate-message {
      display: flex;
    }
    #intro-video-container {
      display: none;
    }
  }

    #cell-scene-container {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    background: black;
  }

    #joystick {
    display: none;
    position: fixed;
    left: 40px;
    bottom: 40px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.4);
    z-index: 20000;
    touch-action: none;
  }

  #joystick-knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 56px;
    height: 56px;
    margin-left: -28px;
    margin-top: -28px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.6);
    pointer-events: none;
  }

    #grab-button {
    display: none;
    position: fixed;
    right: 40px;
    bottom: 50px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    z-index: 20000;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 14px;
    color: white;
    background: rgba(192, 57, 43, 0.85);
    border: 2px solid white;
    touch-action: none;
  }

   #pull-button {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    width: 130px;
    height: 130px;
    border-radius: 50%;
    z-index: 20000;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 18px;
    color: white;
    background: rgba(211, 84, 0, 0.9);
    border: 3px solid white;
    touch-action: none;
  }

  #pull-button:active {
    transform: translateX(-50%) scale(0.92);
  }

  #start-button {
    display: none;
    position: fixed;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20000;
    padding: 16px 48px;
    font-size: 20px;
    font-family: sans-serif;
    font-weight: bold;
    color: white;
    background: #c0392b;
    border: 2px solid white;
    border-radius: 8px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <div id="rotate-message">
    Tourne ton téléphone en mode paysage pour jouer 📱↻
  </div>

    <div id="intro-video-container">
    <video id="intro-video" autoplay muted playsinline>
      <source src="video1.mp4" type="video/mp4">
    </video>
  </div>

  <div id="cell-scene-container"></div>
      <button id="start-button">COMMENCER</button>
    <div id="joystick"><div id="joystick-knob"></div></div>
    <button id="grab-button">ATTRAPER</button>
  <button id="pull-button">TIRER</button>

<script>
const video = document.getElementById('intro-video');
const videoContainer = document.getElementById('intro-video-container');
const cellContainer = document.getElementById('cell-scene-container');
const startButton = document.getElementById('start-button');
const grabButton = document.getElementById('grab-button');
const pullButton = document.getElementById('pull-button');

// JOYSTICK
const joystick = document.getElementById('joystick');
const knob = document.getElementById('joystick-knob');
const joy = { x: 0, y: 0 };
let joyActive = false;
const JOY_RADIUS = 50;

function joyMove(e) {
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const dist = Math.hypot(dx, dy);
  if (dist > JOY_RADIUS) {
    dx = dx / dist * JOY_RADIUS;
    dy = dy / dist * JOY_RADIUS;
  }
  knob.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
  joy.x = dx / JOY_RADIUS;
  joy.y = -dy / JOY_RADIUS;
}

function joyEnd() {
  joyActive = false;
  joy.x = 0;
  joy.y = 0;
  knob.style.transform = 'translate(0px, 0px)';
}

joystick.addEventListener('pointerdown', (e) => {
  joyActive = true;
  joystick.setPointerCapture(e.pointerId);
  joyMove(e);
});
joystick.addEventListener('pointermove', (e) => { if (joyActive) joyMove(e); });
joystick.addEventListener('pointerup', joyEnd);
joystick.addEventListener('pointercancel', joyEnd);

let sceneReady = false;
let videoEnded = false;
let startCellSequence = null;

function tryStart() {
  if (sceneReady && videoEnded) {
    videoContainer.style.opacity = '0';
    setTimeout(() => { videoContainer.style.display = 'none'; }, 1000);
    startCellSequence();
  }
}

video.addEventListener('ended', () => {
  videoEnded = true;
  tryStart();
});

initCellScene(); // préchargement pendant la vidéo

function initCellScene() {
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
    cellContainer.appendChild(renderer.domElement);

  // MODE RÉGLAGE (temporaire)
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'p') {
      const c = camera.position, t = controls.target;
      console.log('CAMERA: ' + c.x.toFixed(2) + ', ' + c.y.toFixed(2) + ', ' + c.z.toFixed(2) +
                  ' | CIBLE: ' + t.x.toFixed(2) + ', ' + t.y.toFixed(2) + ', ' + t.z.toFixed(2));
    }
  });
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  renderer.domElement.addEventListener('dblclick', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(scene.children, true);
    if (hits.length) {
      const p = hits[0].point;
      console.log('SOL: ' + p.x.toFixed(2) + ', ' + p.y.toFixed(2) + ', ' + p.z.toFixed(2));
    }
  });

  const ambient = new THREE.AmbientLight(0x404050, 1.5);
  scene.add(ambient);
  const moonLight = new THREE.DirectionalLight(0x8899ff, 0.8);
  moonLight.position.set(2, 5, 2);
  scene.add(moonLight);

  const gltfLoader = new THREE.GLTFLoader();
  const fbxLoader = new THREE.FBXLoader();

    let mixer;
  let boy;
  let dungeonLoaded = false;
    let boyLoaded = false;
    let playerActive = false;
  let idleAction = null;
  let walkAction = null;
      let currentAction = null;
   let rustyBar = null;
    let grabbing = false;               // true = le garçon est occupé (pas de marche)
  const GRAB_DISTANCE = 0.6;          // distance pour voir le bouton
  const barPos = new THREE.Vector3(); // centre du barreau rouillé
  let hasChain = false;
  let liftAction = null;
  let handChain = null;

  // Bloque le déplacement horizontal du bassin (animation sur place)
  function lockHipsXZ(clip) {
    clip.tracks.forEach((track) => {
      if (track.name.includes('Hips') && track.name.endsWith('.position')) {
        const v = track.values;
        const x0 = v[0], z0 = v[2];
        for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i + 2] = z0; }
      }
    });
  }

  // Fabrique une chaîne enroulée (maillons en anneaux)
  function makeChain(links, linkSize) {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, metalness: 0.8, roughness: 0.5 });
    const geo = new THREE.TorusGeometry(linkSize, linkSize * 0.25, 6, 12);
    for (let i = 0; i < links; i++) {
      const link = new THREE.Mesh(geo, mat);
      link.scale.set(1, 1.6, 1);
      const angle = i * 0.5;
      const radius = linkSize * 2 + i * linkSize * 0.25;
      link.position.set(Math.cos(angle) * radius, linkSize * 0.3, Math.sin(angle) * radius);
      link.rotation.y = -angle;
      if (i % 2 === 0) link.rotation.x = Math.PI / 2;
      group.add(link);
    }
    return group;
  }

  // Chaîne posée au sol dans la cellule
  const chainPos = new THREE.Vector3(-1.2, 0.32, 1.2);
  let chainFloor = makeChain(30, 0.025);
  chainFloor.position.copy(chainPos);
  scene.add(chainFloor);

  function distXZ(a, b) {
    const dx = a.x - b.x, dz = a.z - b.z;
    return Math.sqrt(dx * dx + dz * dz);
  }

    // CHAÎNE PHYSIQUE : le premier maillon suit la main, les autres traînent
  const CHAIN_LINKS = 24;
  const LINK_LEN = 0.045;
    const FLOOR_Y = 0.34;
  const CHAIN_SLACK = 1.06;   // mou de la chaîne quand il relâche (1 = parfaitement tendue)
  let curLinkLen = LINK_LEN;  // longueur actuelle des maillons (change pendant le tirage)
  let chainPts = null;
  const chainMeshes = [];
      let chainHand = null;

  // LANCER
  let throwAction = null;
  let chainFly = null;                   // vol du bout de chaîne vers le barreau
  let chainOnBar = false;                // chaîne accrochée au barreau
  const chainAnchor = new THREE.Vector3();
  let wrapRing = null;
  const THROW_DISTANCE = 1.0;            // distance max pour lancer
  const RELEASE_AT = 0.5;                // moment du lâcher (0.5 = milieu du geste)
  const PULL_HEIGHT = 0.8;               // hauteur d'accroche (poitrine)

  function startThrow() {
    if (!throwAction || !chainPts) return;
    grabbing = true;
    boy.rotation.y = Math.atan2(barPos.x - boy.position.x, barPos.z - boy.position.z);
    throwAction.reset().play();
    currentAction.crossFadeTo(throwAction, 0.2, false);
    currentAction = throwAction;

    // Lâcher le bout de la chaîne en cours de geste
    setTimeout(() => {
      chainAnchor.set(barPos.x, boy.position.y + PULL_HEIGHT, barPos.z);
      chainFly = { from: chainPts[chainPts.length - 1].pos.clone(), t: 0, duration: 0.35 };
    }, throwAction.getClip().duration * 1000 * RELEASE_AT);
  }

    function finishThrow() {
    // Enchaîne sur le début du tirage : il tend les bras et agrippe la chaîne
    pullAction.reset().play();
    pullAction.paused = true;
    pullAction.time = 0;
    throwAction.crossFadeTo(pullAction, 0.3, false);
    currentAction = pullAction;
    pullAnim = { to: pullStart, speed: 1.0, onDone: () => {
      pullButton.style.display = 'block';
    }};
  }

  function attachChain() {
    chainOnBar = true;
    wrapRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.035, 0.008, 6, 16),
      new THREE.MeshStandardMaterial({ color: 0x4a4a4a, metalness: 0.8, roughness: 0.5 })
    );
    wrapRing.rotation.x = Math.PI / 2;
    wrapRing.position.copy(chainAnchor);
    scene.add(wrapRing);
       console.log('Chaîne accrochée au barreau');
  }

  // TIRER
  let pullAction = null;
  let stumbleAction = null;
  let pullCount = 0;
  let pulling = false;
  let barBroken = false;
  let barShake = 0;
  let chainDropped = false;
  let barPivot = null;
  let barPivotBase = null;
  let barFall = null;
  const barBox = new THREE.Box3();
        const PULL_GRAB = 0.35;   // moment (0 à 1) où ses mains agrippent la chaîne
  const PULL_YANK = 0.85;   // moment (0 à 1) où l'arrachement est terminé
  let pullStart = 0;        // calculé au chargement (secondes)
  let pullEnd = 0;          // calculé au chargement (secondes)
  let pullAnim = null;      // mouvement en cours dans l'animation de tirage
  const LOOK_STRENGTH = 0.7; // force du regard vers la chaîne (0 = désactivé)
  let headBone = null;
     const PULLS_NEEDED = 3;     // nombre d'appuis pour casser le barreau
  const SHAKE_START = 0.2;    // moment (0 à 1) de l'arrachement où il commence vraiment à forcer
  let rustDropped = false;
  const STUMBLE_SKIP = 0.3;   // secondes sautées au début de la chute (l'élan inutile)
  const BAR_DELAY = 0;        // retard du barreau en secondes (si le garçon est encore en retard)
  const rustParticles = [];
  const rustGeo = new THREE.BoxGeometry(0.012, 0.012, 0.012);
  const rustMat = new THREE.MeshStandardMaterial({ color: 0x8a3a15 });

    pullButton.addEventListener('click', () => {
    if (!pullAction || pulling || barBroken || pullAnim) return;
    pulling = true;
    pullCount++;
       rustDropped = false;             // la rouille tombera au pic de l'effort

    // Arrachement complet
    pullAnim = { to: pullEnd, speed: 1.0, onDone: () => {
      if (pullCount >= PULLS_NEEDED) {
        pulling = false;
        breakBar();
        return;
      }
      // Il relâche un peu et revient vers le barreau, prêt à retirer
      pullAnim = { to: pullStart, speed: 0.6, onDone: () => { pulling = false; } };
    }};
  });

  function dropRust(n) {
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(rustGeo, rustMat);
      m.position.set(
        barPos.x + (Math.random() - 0.5) * 0.06,
        chainAnchor.y + (Math.random() - 0.5) * 0.4,
        barPos.z + (Math.random() - 0.5) * 0.06
      );
      m.userData.v = new THREE.Vector3((Math.random() - 0.5) * 0.3, 0, (Math.random() - 0.5) * 0.3);
      scene.add(m);
      rustParticles.push(m);
    }
  }

  function updateRust(delta) {
    for (let i = rustParticles.length - 1; i >= 0; i--) {
      const m = rustParticles[i];
      m.userData.v.y -= 9.8 * delta;
      m.position.addScaledVector(m.userData.v, delta);
      if (m.position.y <= FLOOR_Y - 0.015) {
        m.position.y = FLOOR_Y - 0.015; // la poussière de rouille reste au sol
        rustParticles.splice(i, 1);
      }
    }
  }

    // SORTIE DE LA CELLULE
  let squeezeAction = null;
  let squeezing = false;
  let outside = false;
  let squeeze = null;
  const SQUEEZE_TRIGGER = 0.55; // distance au trou qui déclenche le faufilement
  const SQUEEZE_SPEED = 0.35;   // vitesse en passant accroupi
  const SQUEEZE_OUT = 0.6;      // distance parcourue de l'autre côté des barreaux

  function switchAction(a, fade) {
    if (!a || a === currentAction) return;
    a.reset().play();
    currentAction.crossFadeTo(a, fade, false);
    currentAction = a;
  }

  // Trouve le mur du barreau et la direction vers l'extérieur
  function barWallNormal() {
    const walls4 = [
      { n: new THREE.Vector3(-1, 0, 0), d: Math.abs(barPos.x - CELL.minX) },
      { n: new THREE.Vector3(1, 0, 0),  d: Math.abs(barPos.x - CELL.maxX) },
      { n: new THREE.Vector3(0, 0, -1), d: Math.abs(barPos.z - CELL.minZ) },
      { n: new THREE.Vector3(0, 0, 1),  d: Math.abs(barPos.z - CELL.maxZ) }
    ];
    walls4.sort((a, b) => a.d - b.d);
    return walls4[0].n;
  }

  function startSqueeze() {
    squeezing = true;
    grabbing = true; // bloque le joystick pendant la séquence
    const n = barWallNormal();
    const base = new THREE.Vector3(barPos.x, boy.position.y, barPos.z);
    squeeze = {
      phase: 'approach',
      inside: base.clone().addScaledVector(n, -0.3), // devant le trou, côté cellule
      out: base.clone().addScaledVector(n, SQUEEZE_OUT)  // de l'autre côté
    };
    switchAction(walkAction, 0.2);
    console.log('Le garçon se faufile');
  }

  function updateSqueeze(delta) {
    if (!squeeze) return;
    const target = squeeze.phase === 'approach' ? squeeze.inside : squeeze.out;
    const to = new THREE.Vector3(target.x - boy.position.x, 0, target.z - boy.position.z);
    const dist = to.length();
    if (dist > 0.02) {
      to.normalize();
      const speed = squeeze.phase === 'approach' ? 0.6 : SQUEEZE_SPEED;
      const step = Math.min(dist, speed * delta);
      boy.position.x += to.x * step;
      boy.position.z += to.z * step;
      // Rotation douce vers la direction de marche
      let diff = Math.atan2(to.x, to.z) - boy.rotation.y;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      boy.rotation.y += diff * Math.min(1, delta * 8);
    } else if (squeeze.phase === 'approach') {
      squeeze.phase = 'crouch';
      switchAction(squeezeAction, 0.3); // il se baisse
    } else {
      finishSqueeze();
    }
  }

  function finishSqueeze() {
    squeeze = null;
    squeezing = false;
    outside = true;
    grabbing = false;
    switchAction(idleAction, 0.4); // il se redresse
    console.log('Le garçon est sorti de la cellule');
  }

  function breakBar() {
        barBroken = true;
    pullAnim = null;
    pullButton.style.display = 'none';
    console.log('CRAC ! Le barreau cède');
    dropRust(25);

    // Le barreau est arraché vers le garçon puis bascule sur le côté
    const dir = new THREE.Vector3(boy.position.x - barPos.x, 0, boy.position.z - barPos.z).normalize();
       barFall = { t: 0, wait: BAR_DELAY, axis: dir.clone(), push: dir };

    // La chaîne se détache du barreau et de la main
    chainOnBar = false;
    chainDropped = true;
    if (chainPts) chainPts[0].pos.y = FLOOR_Y;
    if (wrapRing) scene.remove(wrapRing);

           // Le garçon tombe en arrière
    boy.rotation.y = Math.atan2(barPos.x - boy.position.x, barPos.z - boy.position.z);
    stumbleAction.reset().play();
    stumbleAction.time = STUMBLE_SKIP; // saute l'élan du début
    currentAction.crossFadeTo(stumbleAction, 0.05, false);
    currentAction = stumbleAction;
  }

  function finishStumble() {
    idleAction.reset().play();
    stumbleAction.crossFadeTo(idleAction, 0.3, false);
    currentAction = idleAction;
    grabbing = false;
        console.log('Le garçon se relève');
  }

    // Fait avancer (ou reculer) l'animation de tirage jusqu'à un moment précis
  function updatePull(delta) {
    if (!pullAnim || !pullAction) return;
    const dir = pullAnim.to >= pullAction.time ? 1 : -1;
    pullAction.time += dir * pullAnim.speed * delta;
    if ((dir > 0 && pullAction.time >= pullAnim.to) || (dir < 0 && pullAction.time <= pullAnim.to)) {
      pullAction.time = pullAnim.to;
      const done = pullAnim.onDone;
      pullAnim = null;
      if (done) done();
    }
  }

  // Oriente la tête vers la chaîne pendant le lancer et le tirage
  function lookAtChain() {
    if (!boy || barBroken || LOOK_STRENGTH <= 0) return;
    if (currentAction !== throwAction && currentAction !== pullAction) return;
    if (!headBone) boy.traverse((o) => { if (!headBone && o.isBone && /Head$/.test(o.name)) headBone = o; });
    if (!headBone) return;
    const target = chainOnBar || chainFly
      ? chainAnchor
      : new THREE.Vector3(barPos.x, boy.position.y + PULL_HEIGHT, barPos.z);
    boy.updateMatrixWorld(true);
    const animQ = headBone.quaternion.clone();
    headBone.lookAt(target);
    headBone.quaternion.copy(animQ.slerp(headBone.quaternion, LOOK_STRENGTH));
  }

  // Pendant la traction : oriente la poitrine du garçon vers le barreau rouillé
  let facingBones = null;
  function alignPullToBar(delta) {
    if (!pullAction || currentAction !== pullAction || barBroken) return;
    if (!facingBones) {
      let l = null, r = null;
      boy.traverse((o) => {
        if (o.isBone && /LeftArm$/.test(o.name)) l = o;
        if (o.isBone && /RightArm$/.test(o.name)) r = o;
      });
      if (!l || !r) return;
      facingBones = { l, r };
    }
    // Direction de la poitrine, calculée à partir des épaules
    const L = new THREE.Vector3();
    const R = new THREE.Vector3();
    facingBones.l.getWorldPosition(L);
    facingBones.r.getWorldPosition(R);
    const sx = R.x - L.x;
    const sz = R.z - L.z;
    const current = Math.atan2(sz, -sx);

    // Direction voulue : vers le barreau
    const wanted = Math.atan2(barPos.x - boy.position.x, barPos.z - boy.position.z);

    // Écart (le plus court chemin) et rotation progressive
    let diff = wanted - current;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    boy.rotation.y += diff * Math.min(1, delta * 6);
  }

  function updateBar(delta) {
    if (!barPivot) return;
    if (!barBroken) {
            // Tremblement synchronisé avec l'effort du garçon
      barShake = 0;
      if (pullAnim && pullAnim.to === pullEnd) {
        const p = (pullAction.time - pullStart) / (pullEnd - pullStart); // 0 → 1 pendant l'arrachement
        const k = (p - SHAKE_START) / (1 - SHAKE_START);                 // 0 → 1 pendant l'effort réel
        if (k > 0) {
          barShake = Math.sin(Math.min(1, k) * Math.PI) * 0.6 * pullCount; // monte puis redescend
          if (!rustDropped && k >= 0.5) {
            dropRust(5 * pullCount); // la rouille tombe au pic de l'effort
            rustDropped = true;
          }
        }
      }
      const s = barShake * 0.02;
      barPivot.position.set(
        barPivotBase.x + (Math.random() - 0.5) * s,
        barPivotBase.y,
        barPivotBase.z + (Math.random() - 0.5) * s
      );
        } else if (barFall) {
      // Petite attente pour synchroniser avec la chute du garçon
      if (barFall.wait > 0) { barFall.wait -= delta; return; }
      // Chute du barreau
      barFall.t = Math.min(1, barFall.t + delta / 0.6);
      const e = barFall.t * barFall.t; // accélère en tombant
      barPivot.position.copy(barPivotBase).addScaledVector(barFall.push, 0.25 * barFall.t);
      barPivot.quaternion.setFromAxisAngle(barFall.axis, e * Math.PI / 2);
      if (barFall.t >= 1) barFall = null;
    }
  }

  function createDragChain() {
    boy.traverse((o) => { if (!chainHand && o.isBone && /RightHand$/.test(o.name)) chainHand = o; });
    if (!chainHand) return;
    const start = new THREE.Vector3();
    chainHand.getWorldPosition(start);
    chainPts = [];
    for (let i = 0; i < CHAIN_LINKS; i++) {
      const p = new THREE.Vector3(start.x, Math.max(FLOOR_Y, start.y - i * LINK_LEN), start.z);
      chainPts.push({ pos: p, prev: p.clone() });
    }
    const geo = new THREE.TorusGeometry(0.02, 0.005, 6, 10);
    const mat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, metalness: 0.8, roughness: 0.5 });
    for (let i = 0; i < CHAIN_LINKS - 1; i++) {
      const m = new THREE.Mesh(geo, mat);
      m.scale.set(1, 1.6, 1);
      scene.add(m);
      chainMeshes.push(m);
    }
  }

    function updateChain(delta) {
    if (!chainPts) return;
    const g = -9.8 * delta * delta;

    // Pendant le tirage : la chaîne se tend entre la main et le barreau
    const taut = chainOnBar && currentAction === pullAction;
    let linkLen = LINK_LEN;
    if (taut) {
      const hand = new THREE.Vector3();
      chainHand.getWorldPosition(hand);
      const yanking = pullAnim && pullAnim.to === pullEnd; // en plein arrachement
      const slack = yanking ? 1.0 : CHAIN_SLACK;
      linkLen = hand.distanceTo(chainAnchor) * slack / (CHAIN_LINKS - 1);
    }
    curLinkLen += (linkLen - curLinkLen) * Math.min(1, delta * 10);

    // Gravité + inertie (frottement plus fort au sol)
    for (let i = 1; i < chainPts.length; i++) {
      const p = chainPts[i];
            const damp = taut ? 0.5 : (p.pos.y <= FLOOR_Y + 0.001 ? 0.6 : 0.9);
      const vx = (p.pos.x - p.prev.x) * damp;
      const vy = (p.pos.y - p.prev.y) * damp;
      const vz = (p.pos.z - p.prev.z) * damp;
      p.prev.copy(p.pos);
      p.pos.x += vx;
      p.pos.y += vy + g;
      p.pos.z += vz;
    }

        // Premier maillon collé à la main
        if (!chainDropped) chainHand.getWorldPosition(chainPts[0].pos);

    // Dernier maillon : en vol vers le barreau, puis accroché
    const last = chainPts[chainPts.length - 1];
    if (chainFly) {
      chainFly.t = Math.min(1, chainFly.t + delta / chainFly.duration);
      last.pos.lerpVectors(chainFly.from, chainAnchor, chainFly.t);
      last.pos.y += Math.sin(chainFly.t * Math.PI) * 0.25; // petit arc
      if (chainFly.t >= 1) {
        chainFly = null;
        attachChain();
      }
    } else if (chainOnBar) {
      last.pos.copy(chainAnchor);
    }
    const lastPinned = !!chainFly || chainOnBar;

    // Garder la longueur des maillons + ne pas passer sous le sol
        for (let k = 0; k < (taut ? 20 : 8); k++) {
      for (let i = 0; i < chainPts.length - 1; i++) {
        const a = chainPts[i].pos, b = chainPts[i + 1].pos;
        const d = b.clone().sub(a);
        const len = d.length() || 0.0001;
                const diff = (len - curLinkLen) / len;
                const wa = i === 0 ? 0 : 1;
        const wb = (i + 1 === chainPts.length - 1 && lastPinned) ? 0 : 1;
        if (wa + wb === 0) continue;
        a.addScaledVector(d, diff * wa / (wa + wb));
        b.addScaledVector(d, -diff * wb / (wa + wb));
      }
      for (let i = 1; i < chainPts.length; i++) {
        if (chainPts[i].pos.y < FLOOR_Y) chainPts[i].pos.y = FLOOR_Y;
      }
    }

    // Placer et orienter chaque maillon
    const up = new THREE.Vector3(0, 1, 0);
    for (let i = 0; i < chainMeshes.length; i++) {
      const a = chainPts[i].pos, b = chainPts[i + 1].pos;
      const m = chainMeshes[i];
      m.position.copy(a).add(b).multiplyScalar(0.5);
      const dir = b.clone().sub(a).normalize();
      m.quaternion.setFromUnitVectors(up, dir);
      if (i % 2 === 1) m.rotateY(Math.PI / 2); // maillons alternés
    }
  }

  function startPickup() {
    if (!liftAction) return;
    grabbing = true;
    boy.rotation.y = Math.atan2(chainPos.x - boy.position.x, chainPos.z - boy.position.z);
    liftAction.reset().play();
    currentAction.crossFadeTo(liftAction, 0.2, false);
    currentAction = liftAction;
  }

  function finishPickup() {
    scene.remove(chainFloor);
    chainFloor = null;
    hasChain = true;

        // Chaîne tenue par un bout, le reste traîne au sol
    createDragChain();

    idleAction.reset().play();
    liftAction.crossFadeTo(idleAction, 0.3, false);
    currentAction = idleAction;
    grabbing = false;
    console.log('Chaîne ramassée');
  }

  grabButton.addEventListener('click', () => {
    if (!boy || grabbing) return;
    const action = grabButton.dataset.action;
    grabButton.style.display = 'none';
        if (action === 'pickup') startPickup();
    if (action === 'throw') startThrow();
  }); 

  // COLLISIONS : murs invisibles de la cellule
  const CELL = { minX: -1.73, maxX: 0.52, minZ: -2.38, maxZ: 2.38 };
  const WALL_T = 0.1;       // épaisseur des murs
    const BOY_RADIUS = 0.3;   // "largeur" du garçon (inclut tête et pieds en mouvement)
  const SHOW_WALLS = false;  // mettre false pour les rendre invisibles

  const walls = [
    { minX: CELL.minX - WALL_T, maxX: CELL.minX, minZ: CELL.minZ - WALL_T, maxZ: CELL.maxZ + WALL_T },
    { minX: CELL.maxX, maxX: CELL.maxX + WALL_T, minZ: CELL.minZ - WALL_T, maxZ: CELL.maxZ + WALL_T },
    { minX: CELL.minX - WALL_T, maxX: CELL.maxX + WALL_T, minZ: CELL.minZ - WALL_T, maxZ: CELL.minZ },
    { minX: CELL.minX - WALL_T, maxX: CELL.maxX + WALL_T, minZ: CELL.maxZ, maxZ: CELL.maxZ + WALL_T }
  ];

  if (SHOW_WALLS) {
    walls.forEach((w) => {
      const geo = new THREE.BoxGeometry(w.maxX - w.minX, 1.5, w.maxZ - w.minZ);
      const mat = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.3 });
      const box = new THREE.Mesh(geo, mat);
      box.position.set((w.minX + w.maxX) / 2, 0.32 + 0.75, (w.minZ + w.maxZ) / 2);
      scene.add(box);
    });
  }

  function collides(x, z) {
    for (const w of walls) {
      const cx = Math.max(w.minX, Math.min(x, w.maxX));
      const cz = Math.max(w.minZ, Math.min(z, w.maxZ));
      const dx = x - cx;
      const dz = z - cz;
      if (dx * dx + dz * dz < BOY_RADIUS * BOY_RADIUS) return true;
    }
    return false;
  }

    // COLLISIONS HORS DE LA CELLULE : rayons contre le modèle du donjon
  let dungeonModel = null;
  const wallRay = new THREE.Raycaster();
  const RAY_HEIGHTS = [0.25, 0.7]; // hauteur des genoux et de la poitrine

  function blockedByModel(fromX, fromZ, dirX, dirZ) {
    if (!dungeonModel || (dirX === 0 && dirZ === 0)) return false;
    const dir = new THREE.Vector3(dirX, 0, dirZ).normalize();
    wallRay.far = BOY_RADIUS;
    for (const h of RAY_HEIGHTS) {
      wallRay.set(new THREE.Vector3(fromX, boy.position.y + h, fromZ), dir);
      if (wallRay.intersectObject(dungeonModel, true).length) return true;
    }
    return false;
  }

  function checkReady() {      
    if (dungeonLoaded && boyLoaded && startCellSequence) {
      sceneReady = true;
      tryStart();
    }
  }

  function normalizeSize(object, targetHeight) {
    const box = new THREE.Box3().setFromObject(object);
    const size = new THREE.Vector3();
    box.getSize(size);
    const scaleFactor = targetHeight / size.y;
    object.scale.setScalar(scaleFactor);
    const box2 = new THREE.Box3().setFromObject(object);
    const center = new THREE.Vector3();
    box2.getCenter(center);
    object.position.x -= center.x;
    object.position.z -= center.z;
    object.position.y -= box2.min.y;
    return box2;
  }

  gltfLoader.load('models/castle_dungeon_v2.glb', (gltf) => {
    const dungeon = gltf.scene;
    normalizeSize(dungeon, 2.5);

       scene.add(dungeon);
    dungeonModel = dungeon; // utilisé pour les collisions hors de la cellule
           console.log('Cellule chargée et ajustée');

        // BARREAU ROUILLÉ
    dungeon.traverse((o) => {
      if (o.isMesh && o.name === 'defaultMaterial008') rustyBar = o;
    });
    if (rustyBar) {
      rustyBar.material = rustyBar.material.clone(); // pour ne pas teinter les autres barreaux
            rustyBar.material.color.set(0xb0562a);        // teinte rouille
            rustyBar.material.emissive = new THREE.Color(0x5a1e08); // lueur rouille sombre
      rustyBar.material.emissiveIntensity = 0.35;
           console.log('Barreau rouillé trouvé');
           barBox.setFromObject(rustyBar);
      barBox.getCenter(barPos);

      // Pivot à la base du barreau : pour le faire trembler et basculer
      barPivot = new THREE.Group();
      barPivot.position.set(barPos.x, barBox.min.y, barPos.z);
      scene.add(barPivot);
      barPivot.attach(rustyBar);
      barPivotBase = barPivot.position.clone();
    } else {
      console.error('Barreau rouillé introuvable');
    }
    dungeonLoaded = true;
    checkReady();
  }, undefined, (error) => console.error('Erreur chargement cellule:', error));

    const boyTexture = new THREE.TextureLoader().load('textures/Image_0.jpg');

    fbxLoader.load('animations/getting_up.fbx', (fbx) => {
    boy = fbx;
    boy.traverse((child) => {
      if (child.isMesh) {
        child.material = new THREE.MeshStandardMaterial({ map: boyTexture, skinning: true });
      }
    });
    normalizeSize(boy, 1.3);
        boy.position.x = -0.3;
    boy.position.z = -1;
    boy.position.y += 0.32; // pose les pieds sur le sol de la cellule
    scene.add(boy);
    console.log('Garçon riggé chargé');

    // Vue figée (celle que tu as choisie)
    camera.position.set(3.80, 1.11, -1.23);
    controls.target.set(-0.07, 1.15, -1.51);
    controls.enabled = false;

        mixer = new THREE.AnimationMixer(boy);
    const situpAction = mixer.clipAction(fbx.animations[0]);
    situpAction.setLoop(THREE.LoopOnce);
    situpAction.clampWhenFinished = true;

    // Fige le garçon sur la première image (assis) en attendant la fin de la vidéo
    situpAction.play();
        situpAction.paused = true;
    mixer.update(0);

        fbxLoader.load('animations/lifting.fbx', (anim) => {
      lockHipsXZ(anim.animations[0]);
      liftAction = mixer.clipAction(anim.animations[0]);
      liftAction.setLoop(THREE.LoopOnce);
      liftAction.clampWhenFinished = true;
      mixer.addEventListener('finished', (e) => {
        if (e.action === liftAction) finishPickup();
      });
      console.log('Ramassage chargé');
    }, undefined, (error) => console.error('Erreur lifting:', error));

        fbxLoader.load('animations/toss_grenade.fbx', (anim) => {
      lockHipsXZ(anim.animations[0]);
      throwAction = mixer.clipAction(anim.animations[0]);
      throwAction.setLoop(THREE.LoopOnce);
      throwAction.clampWhenFinished = true;
      mixer.addEventListener('finished', (e) => {
        if (e.action === throwAction) finishThrow();
      });
      console.log('Lancer chargé');
    }, undefined, (error) => console.error('Erreur frisbee_throw:', error));

           fbxLoader.load('animations/pull_pilot_from_seat.fbx', (anim) => {
      lockHipsXZ(anim.animations[0]);
      pullAction = mixer.clipAction(anim.animations[0]);
      pullAction.setLoop(THREE.LoopOnce);
      pullAction.clampWhenFinished = true;
      const d = anim.animations[0].duration;
      pullStart = d * PULL_GRAB;
      pullEnd = d * PULL_YANK;
      console.log('Traction chargée, durée : ' + d + ' s');
    }, undefined, (error) => console.error('Erreur pull_pilot_from_seat:', error));

        fbxLoader.load('animations/crouched_walking.fbx', (anim) => {
      lockHipsXZ(anim.animations[0]);
      squeezeAction = mixer.clipAction(anim.animations[0]);
      squeezeAction.setLoop(THREE.LoopRepeat);
      console.log('Marche accroupie chargée');
    }, undefined, (error) => console.error('Erreur crouched_walking:', error));

    fbxLoader.load('animations/stumble_backwards.fbx', (anim) => {
      lockHipsXZ(anim.animations[0]);
      stumbleAction = mixer.clipAction(anim.animations[0]);
      stumbleAction.setLoop(THREE.LoopOnce);
      stumbleAction.clampWhenFinished = true;
      mixer.addEventListener('finished', (e) => {
        if (e.action === stumbleAction) finishStumble();
      });
      console.log('Chute chargée');
    }, undefined, (error) => console.error('Erreur stumble_backwards:', error));

    fbxLoader.load('animations/walking.fbx', (anim) => {
      walkAction = mixer.clipAction(anim.animations[0]);
      walkAction.setLoop(THREE.LoopRepeat);
      console.log('Marche chargée');
    }, undefined, (error) => console.error('Erreur walking:', error));

    fbxLoader.load('animations/injured_stumble_idle.fbx', (anim) => {
            // Bloque le déplacement horizontal du bassin (fatigue sur place)
      anim.animations[0].tracks.forEach((track) => {
        if (track.name.includes('Hips') && track.name.endsWith('.position')) {
          const v = track.values;
          const x0 = v[0];
          const z0 = v[2];
          for (let i = 0; i < v.length; i += 3) {
            v[i] = x0;
            v[i + 2] = z0;
          }
        }
      });

      const tiredAction = mixer.clipAction(anim.animations[0]);
      tiredAction.setLoop(THREE.LoopRepeat);

      const onFinished = (e) => {
        if (e.action !== situpAction) return;
        mixer.removeEventListener('finished', onFinished);
                // Position du bassin à la fin du relevé
        let hips = null;
        boy.traverse((o) => { if (!hips && o.isBone && o.name.includes('Hips')) hips = o; });
        const before = new THREE.Vector3();
        hips.getWorldPosition(before);

        // Passage direct à la fatigue
        situpAction.stop();
        tiredAction.reset().play();
        mixer.update(0);
        boy.updateMatrixWorld(true);

        // Recale le garçon pour que la fatigue démarre au même endroit
        const after = new THREE.Vector3();
        hips.getWorldPosition(after);
        boy.position.x += before.x - after.x;
                boy.position.z += before.z - after.z;
        idleAction = tiredAction;
        currentAction = tiredAction;
        console.log('Fatigue lancée');

        setTimeout(() => {
          startButton.style.display = 'block';
        }, anim.animations[0].duration * 1000);
      };
      mixer.addEventListener('finished', onFinished);

      startCellSequence = () => {
        situpAction.paused = false;
        console.log('Situp lancé');
      };

      boyLoaded = true;
      checkReady();
    }, undefined, (error) => console.error('Erreur injured_stumble:', error));

    startButton.addEventListener('click', () => {
      startButton.style.display = 'none';
            console.log('Début du jeu');
      playerActive = true;
      joystick.style.display = 'block';
      // ici on activera les contrôles du joueur à l'étape suivante
    });
  }, undefined, (error) => console.error('Erreur chargement garçon:', error));
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
               if (playerActive && boy && !grabbing && (joy.x !== 0 || joy.y !== 0)) {
      // Direction relative à la caméra : haut du joystick = s'éloigner de la caméra
      const fwd = new THREE.Vector3().subVectors(controls.target, camera.position);
      fwd.y = 0;
      fwd.normalize();
      const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
      const move = new THREE.Vector3()
        .addScaledVector(fwd, joy.y)
        .addScaledVector(right, joy.x);

      const speed = 0.8;
            const nx = boy.position.x + move.x * speed * delta;
      const nz = boy.position.z + move.z * speed * delta;
           const sx = Math.sign(move.x), sz = Math.sign(move.z);
      if (!collides(nx, boy.position.z) && !(outside && blockedByModel(boy.position.x, boy.position.z, sx, 0))) boy.position.x = nx;
      if (!collides(boy.position.x, nz) && !(outside && blockedByModel(boy.position.x, boy.position.z, 0, sz))) boy.position.z = nz;
      boy.rotation.y = Math.atan2(move.x, move.z);
    }

       // Marche si le joystick bouge, sinon fatigue
       if (playerActive && idleAction && walkAction && !grabbing) {
            const moving = !grabbing && (joy.x !== 0 || joy.y !== 0);
      const wanted = moving ? walkAction : idleAction;
      if (wanted !== currentAction) {
        wanted.reset().play();
        currentAction.crossFadeTo(wanted, 0.2, false);
        currentAction = wanted;
      }
    }

           // BOUTON D'ACTION selon le contexte
    if (playerActive && boy && !grabbing) {
      let action = null;
      if (!hasChain && chainFloor && distXZ(boy.position, chainPos) < GRAB_DISTANCE) {
        action = 'pickup';
        grabButton.textContent = 'ATTRAPER';
      }
            if (hasChain && !chainOnBar && !chainFly && rustyBar && distXZ(boy.position, barPos) < THROW_DISTANCE) {
        action = 'throw';
        grabButton.textContent = 'LANCER';
      }
      grabButton.dataset.action = action || '';
      grabButton.style.display = action ? 'block' : 'none';
    }

              // Sortie : se faufile automatiquement dès qu'il approche du trou
    if (playerActive && boy && barBroken && !outside && !squeezing && !grabbing && squeezeAction
        && distXZ(boy.position, barPos) < SQUEEZE_TRIGGER) startSqueeze();
    updateSqueeze(delta);
    updatePull(delta);
    if (mixer) mixer.update(delta);
    alignPullToBar(delta);
    lookAtChain();
    updateChain(delta);
    updateBar(delta);
    updateRust(delta);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}
startButton.addEventListener('click', () => {
  startButton.style.display = 'none';
  // ici on activera les contrôles du joueur à l'étape suivante
});
</script>
